<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Erik Henrique</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a3a5f 0%, #0a1128 100%);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Mantém a tela fixa */
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .logo { font-weight: 700; font-size: 1.2rem; }
        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .nav-links a:hover { color: #fff; }

        .hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 0 10%;
            margin-top: 80px;
        }

        .profile-pic {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .content h1 { font-size: 4rem; margin-bottom: 10px; }
        .content h2 { font-size: 1.5rem; font-weight: 300; color: #ccc; margin-bottom: 20px; }
        .content p { max-width: 450px; line-height: 1.6; color: rgba(255, 255, 255, 0.8); margin-bottom: 30px; }

        .highlight { color: #a855f7; font-weight: 700; }

        /* BOTÕES */
        .btn-group { display: flex; gap: 15px; }

        .btn {
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        /* Espaçamento do ícone */
        .btn i { margin-right: 10px; font-size: 1.1rem; }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btn-purple { background: #8a2be2; color: white; }
        .btn-outline { border: 1px solid rgba(255, 255, 255, 0.3); color: white; }
        .btn-cyan { background: #00e5ff; color: #0a1128; }

        @media (max-width: 768px) {
            .hero { flex-direction: column; text-align: center; overflow-y: auto; padding: 100px 5%; }
            .btn-group { flex-direction: column; align-items: center; }
            .content h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Erik Henrique</div>
        <nav class="nav-links">
            <a href="Currículo_Erik_Novo.pdf" download>Currículo</a>
            <a href="#projetos">Projetos</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <main class="hero">
        <div class="profile-container">
            <img src="suafoto.jpg" alt="Erik Henrique" class="profile-pic">
        </div>

        <div class="content">
            <h1>Olá!</h1>
            <h2>Um pouco sobre mim</h2>
            <p>
                Sou um <span class="highlight">Analista de Dados</span> e Desenvolvedor de 
                <span class="highlight">BI & Automação</span> focado em transformar dados brutos em insights estratégicos.
            </p>
            
            <div class="btn-group">
                <a href="Currículo_Erik_Novo.pdf" download="Currículo_Erik_Novo.pdf" class="btn btn-purple">
                    <i class="fas fa-file-download"></i> Currículo
                </a>

                <a href="https://github.com/SEU-USUARIO" target="_blank" class="btn btn-outline">
                    <i class="fas fa-code"></i> Projetos
                </a>

                <a href="https://wa.me/5524998124890?text=Olá%20Erik!%20Vi%20seu%20portfólio." target="_blank" class="btn btn-cyan">
                    <i class="fab fa-whatsapp"></i> Contato
                </a>
            </div>
        </div>
    </main>

</body>
</html>
