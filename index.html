<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Erik Henrique</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Fundo com gradiente radial profundo para destacar o centro */
            background: radial-gradient(circle at center, #1a3a5f 0%, #0a1128 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER COM EFEITO GLASSMORPHISM */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: 1px; }
        
        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            margin-left: 25px;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .nav-links a:hover { color: #00e5ff; }

        /* SEÇÃO PRINCIPAL (HERO) */
        .hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            padding: 0 10%;
            margin-top: 80px;
        }

        .profile-container {
            position: relative;
        }

        .profile-pic {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            /* Glow suave combinando com o tema */
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }
        
        .profile-pic:hover {
            transform: scale(1.02);
        }

        .content h1 { font-size: 4.5rem; margin-bottom: 5px; line-height: 1; }
        .content h2 { font-size: 1.6rem; font-weight: 300; color: #cbd5e1; margin-bottom: 20px; }
        .content p { 
            max-width: 480px; 
            line-height: 1.7; 
            color: rgba(255, 255, 255, 0.8); 
            margin-bottom: 35px;
            font-size: 1.05rem;
        }

        /* DESTAQUE PARA PALAVRAS-CHAVE */
        .highlight { 
            color: #a855f7; 
            font-weight: 700; 
            border-bottom: 2px solid rgba(168, 85, 247, 0.3);
        }

        /* ESTILIZAÇÃO DOS BOTÕES */
        .btn-group { display: flex; gap: 15px; }

        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ícones dentro dos botões */
        .btn i { margin-right: 10px; font-size: 1.1rem; }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.4);
        }

        /* Cores específicas dos botões */
        .btn-purple { background: #8a2be2; color: white; }
        .btn-purple:hover { background: #9d4edd; box-shadow: 0 0 20px rgba(138, 43, 226, 0.5); }

        .btn-outline { 
            border: 2px solid rgba(255, 255, 255, 0.2); 
            color: white; 
            background: transparent;
        }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.1); border-color: white; }

        .btn-cyan { background: #00e5ff; color: #0a1128; }
        .btn-cyan:hover { background: #33ebff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); }

        /* RESPONSIVIDADE PARA CELULAR */
        @media (max-width: 900px) {
            .hero { flex-direction: column; text-align: center; padding: 100px 5% 50px; }
            .content h1 { font-size: 3rem; }
            .btn-group { flex-direction: column; width: 100%; max-width: 300px; margin: 0 auto; }
            .profile-pic { width: 220px; height: 220px; }
            header { padding: 15px 20px; }
            .nav-links { display: none; } /* Esconde menu no mobile para simplificar */
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ERIK HENRIQUE</div>
        <nav class="nav-links">
            <a href="#sobre">Sobre</a>
            <a href="https://github.com/erikhenrique" target="_blank">Projetos</a>
            <a href="https://wa.me/5524998124890" target="_blank">Contato</a>
        </nav>
    </header>

    <main class="hero">
        <div class="profile-container">
            <img src="img/PerfilEr.jpeg">
        </div>

        <div class="content">
            <h1>Olá!</h1>
            <h2>Um pouco sobre mim</h2>
            <p>
                Sou um <span class="highlight">Analista de Dados</span> e Desenvolvedor de 
                <span class="highlight">BI & Automação</span> focado em transformar dados brutos em decisões inteligentes e processos eficientes.
            </p>
            
            <div class="btn-group">
                <a href="Currículo_Erik_New.pdf" download="Currículo_Erik_New.pdf" class="btn btn-purple">
                    <i class="fas fa-file-download"></i> Currículo
                </a>

                <a href="https://github.com/Erik-us22" target="_blank" class="btn btn-outline">
                    <i class="fas fa-code"></i> Projetos
                </a>

                <a href="https://wa.me/5524998124890?text=Olá%20Erik!%20Vi%20seu%20portfólio%20e%20gostaria%20de%20conversar." 
                   target="_blank" 
                   class="btn btn-cyan">
                    <i class="fab fa-whatsapp"></i> Contato
                </a>
            </div>
        </div>
    </main>

</body>
</html>
