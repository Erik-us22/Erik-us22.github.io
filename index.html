<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Erik Henrique</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Variáveis de Cores Neon (Baseadas no Roxo e Ciano originais) */
        :root {
            --neon-purple: #8a2be2;
            --neon-purple-glow: rgba(138, 43, 226, 0.6);
            --neon-cyan: #00e5ff;
            --neon-cyan-glow: rgba(0, 229, 255, 0.6);
        }

        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a3a5f 0%, #0a1128 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER COM GLASSMORPHISM E LOGO NEON */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .logo { 
            font-weight: 700; 
            font-size: 1.2rem; 
            letter-spacing: 2px; 
            text-shadow: 0 0 10px var(--neon-cyan-glow), 0 0 20px rgba(0, 229, 255, 0.2);
        }
        
        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            margin-left: 25px;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .nav-links a:hover { 
            color: var(--neon-cyan); 
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        /* HERO SECTION */
        .hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            padding: 0 10%;
            margin-top: 80px;
        }

        .profile-container {
            position: relative;
        }

        .profile-pic {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            /* Brilho Neon Roxo na foto */
            box-shadow: 0 0 30px var(--neon-purple-glow), 0 0 60px rgba(138, 43, 226, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        
        .profile-pic:hover {
            transform: scale(1.03);
            box-shadow: 0 0 50px var(--neon-purple), 0 0 80px rgba(138, 43, 226, 0.4);
        }

        /* TEXTOS COM EFEITO NEON */
        .content h1 { 
            font-size: 4.5rem; 
            margin-bottom: 5px; 
            line-height: 1; 
            text-shadow: 0 0 15px var(--neon-purple-glow), 0 0 30px rgba(138, 43, 226, 0.3);
            animation: neonPulse 3s infinite alternate;
        }

        @keyframes neonPulse {
            from { text-shadow: 0 0 10px var(--neon-purple-glow), 0 0 20px rgba(138, 43, 226, 0.2); }
            to { text-shadow: 0 0 20px var(--neon-purple), 0 0 40px rgba(138, 43, 226, 0.5); }
        }

        .content h2 { 
            font-size: 1.6rem; 
            font-weight: 300; 
            color: #cbd5e1; 
            margin-bottom: 20px; 
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .content p { 
            max-width: 480px; 
            line-height: 1.7; 
            color: rgba(255, 255, 255, 0.8); 
            margin-bottom: 35px;
            font-size: 1.05rem;
        }

        .highlight { 
            color: #a855f7; 
            font-weight: 700; 
            border-bottom: 2px solid rgba(168, 85, 247, 0.5);
            text-shadow: 0 0 5px rgba(168, 85, 247, 0.5);
        }

        /* BOTÕES TURBO NEON */
        .btn-group { display: flex; gap: 15px; flex-wrap: wrap; }

        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
        }

        .btn i { margin-right: 10px; font-size: 1.1rem; }

        .btn:hover {
            transform: translateY(-4px);
        }

        /* Estilo Roxo Neon */
        .btn-purple { 
            background: rgba(138, 43, 226, 0.1); 
            color: white; 
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px var(--neon-purple-glow);
        }
        .btn-purple:hover { 
            background: var(--neon-purple); 
            box-shadow: 0 0 25px var(--neon-purple); 
        }

        /* Estilo Outline Neon */
        .btn-outline { 
            border: 2px solid rgba(255, 255, 255, 0.2); 
            color: white; 
            background: transparent;
        }
        .btn-outline:hover { 
            background: rgba(255, 255, 255, 0.1); 
            border-color: white; 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* Estilo Ciano Neon */
        .btn-cyan { 
            background: rgba(0, 229, 255, 0.1); 
            color: var(--neon-cyan); 
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan-glow);
        }
        .btn-cyan:hover { 
            background: var(--neon-cyan); 
            color: #0a1128; 
            box-shadow: 0 0 25px var(--neon-cyan); 
        }

        /* Botão de download menor */
        .btn-download-link {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: underline;
            margin-top: 8px;
            display: inline-block;
            transition: 0.3s;
        }
        .btn-download-link:hover { color: var(--neon-purple); }

        /* RESPONSIVIDADE */
        @media (max-width: 900px) {
            .hero { flex-direction: column; text-align: center; padding: 100px 5% 50px; }
            .content h1 { font-size: 3rem; }
            .btn-group { flex-direction: column; width: 100%; max-width: 300px; margin: 0 auto; }
            .profile-pic { width: 220px; height: 220px; }
            header { padding: 15px 20px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ERIK HENRIQUE</div>
        <nav class="nav-links">
            <a href="#sobre">Sobre</a>
            <a href="https://github.com/Erik-us22" target="_blank">GitHub</a>
            <a href="https://linkedin.com/in/erik-henrique-293734290" target="_blank">LinkedIn</a>
            <a href="mailto:erick.us22@gmail.com">E-mail</a>
            <a href="https://wa.me/5524998124890" target="_blank">WhatsApp</a>
        </nav>
    </header>

    <main class="hero">
        <div class="profile-container">
            <img src="perfil.jpg" alt="Erik Henrique" class="profile-pic">
        </div>

        <div class="content">
            <h1>Olá!</h1>
            <h2>Um pouco sobre mim</h2>
            <p>
                Sou um <span class="highlight">Analista de Dados</span> e Desenvolvedor de 
                <span class="highlight">BI & Automação</span> focado em transformar dados brutos em decisões inteligentes e processos eficientes.
            </p>
            
            <div class="btn-group">
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <a href="Currículo_Erik_New.pdf" target="_blank" class="btn btn-purple">
                        <i class="fas fa-file-alt"></i> Visualizar Currículo
                    </a>
                    <a href="Currículo_Erik_New.pdf" download class="btn-download-link">
                        <i class="fas fa-download"></i> Baixar PDF diretamente
                    </a>
                </div>

                <a href="https://github.com/Erik-us22" target="_blank" class="btn btn-outline">
                    <i class="fas fa-code"></i> Projetos
                </a>

                <a href="https://linkedin.com/in/erik-henrique-293734290" target="_blank" class="btn btn-cyan">
                    <i class="fab fa-linkedin"></i> LinkedIn
                </a>
            </div>
        </div>
    </main>

</body>
</html>
