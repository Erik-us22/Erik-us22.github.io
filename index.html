<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Erik Henrique</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Variáveis de Cores Neon */
        :root {
            --neon-pink: #ff0055;
            --neon-pink-glow: rgba(255, 0, 85, 0.6);
            --neon-cyan: #00e5ff;
            --neon-cyan-glow: rgba(0, 229, 255, 0.6);
            --text-glow: rgba(255, 255, 255, 0.5);
        }

        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Fundo com gradiente radial profundo para destacar o centro */
            background: radial-gradient(circle at center, #1a3a5f 0%, #0a1128 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER COM EFEITO GLASSMORPHISM */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .logo { 
            font-weight: 700; 
            font-size: 1.2rem; 
            letter-spacing: 2px; /* Aumentado levemente */
            color: #fff;
            text-transform: uppercase;
            /* Efeito Neon no Logo */
            text-shadow: 0 0 5px var(--text-glow), 0 0 10px var(--neon-cyan), 0 0 15px var(--neon-cyan);
        }
        
        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            margin-left: 25px;
            font-size: 0.9rem;
            transition: 0.3s;
            position: relative;
        }
        .nav-links a:hover { 
            color: #fff; 
            text-shadow: 0 0 5px var(--text-glow), 0 0 10px var(--neon-cyan);
        }

        /* SEÇÃO PRINCIPAL (HERO) */
        .hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            padding: 0 10%;
            margin-top: 80px;
        }

        .profile-container {
            position: relative;
        }

        .profile-pic {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            /* Glow Neon na foto */
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2), 
                        0 0 40px var(--neon-pink-glow), 
                        0 0 60px var(--neon-pink-glow);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .profile-pic:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3), 
                        0 0 50px var(--neon-pink), 
                        0 0 70px var(--neon-pink);
        }

        /* Efeitos Neon no Texto Principal */
        .content h1 { 
            font-size: 4.5rem; 
            margin-bottom: 5px; 
            line-height: 1; 
            color: #fff;
            text-shadow: 0 0 10px var(--text-glow), 0 0 20px var(--neon-pink), 0 0 30px var(--neon-pink);
            /* Animação suave de pulsação no brilho */
            animation: neonPulse 2s infinite alternate;
        }
        @keyframes neonPulse {
            from { text-shadow: 0 0 10px var(--text-glow), 0 0 20px var(--neon-pink), 0 0 30px var(--neon-pink); }
            to { text-shadow: 0 0 5px var(--text-glow), 0 0 15px var(--neon-pink), 0 0 25px var(--neon-pink); }
        }

        .content h2 { 
            font-size: 1.6rem; 
            font-weight: 300; 
            color: #cbd5e1; 
            margin-bottom: 20px; 
            /* Brilho mais sutil no subtítulo */
            text-shadow: 0 0 5px var(--text-glow), 0 0 10px var(--neon-cyan);
        }
        .content p { 
            max-width: 480px; 
            line-height: 1.7; 
            color: rgba(255, 255, 255, 0.8); 
            margin-bottom: 35px;
            font-size: 1.05rem;
        }

        /* DESTAQUE PARA PALAVRAS-CHAVE COM NEON */
        .highlight { 
            color: var(--neon-pink); 
            font-weight: 700; 
            /* text-shadow: 0 0 5px var(--neon-pink-glow); REMOVIDO PARA MAIOR CLAREZA NO TEXTO LONGO, MAS PODE SER REATIVADO */
        }

        /* ESTILIZAÇÃO DOS BOTÕES */
        .btn-group { display: flex; gap: 15px; }

        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase; /* Botões em caixa alta */
            letter-spacing: 1px;
        }

        /* Ícones dentro dos botões */
        .btn i { margin-right: 10px; font-size: 1.1rem; }

        .btn:hover {
            transform: translateY(-4px);
        }

        /* Cores específicas dos botões com Efeito Neon */
        .btn-purple { 
            background: transparent; 
            color: var(--neon-pink); 
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink-glow);
        }
        .btn-purple:hover { 
            background: var(--neon-pink); 
            color: #fff;
            box-shadow: 0 0 20px var(--neon-pink), 0 0 30px var(--neon-pink);
        }

        .btn-outline { 
            border: 2px solid rgba(255, 255, 255, 0.4); 
            color: white; 
            background: transparent;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .btn-outline:hover { 
            background: rgba(255, 255, 255, 0.1); 
            border-color: #fff; 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .btn-cyan { 
            background: transparent; 
            color: var(--neon-cyan); 
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan-glow);
        }
        .btn-cyan:hover { 
            background: var(--neon-cyan); 
            color: #0a1128;
            box-shadow: 0 0 20px var(--neon-cyan), 0 0 30px var(--neon-cyan);
        }

        /* RESPONSIVIDADE PARA CELULAR */
        @media (max-width: 900px) {
            .hero { flex-direction: column; text-align: center; padding: 100px 5% 50px; gap: 40px; }
            .content h1 { font-size: 3rem; }
            .btn-group { flex-direction: column; width: 100%; max-width: 300px; margin: 0 auto; }
            .profile-pic { width: 220px; height: 220px; }
            header { padding: 15px 20px; }
            .nav-links { display: none; } /* Esconde menu no mobile para simplificar */
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ERIK HENRIQUE</div>
        <nav class="nav-links">
            <a href="#sobre">Sobre</a>
            <a href="https://github.com/erikhenrique" target="_blank">Projetos</a>
            <a href="https://wa.me/5524998124890" target="_blank">Contato</a>
        </nav>
    </header>

    <main class="hero">
        <div class="profile-container">
      <img src="perfil.jpg" alt="Erik Henrique" class="profile-pic">
        </div>

        <div class="content">
            <h1>Olá!</h1>
            <h2>Um pouco sobre mim</h2>
            <p>
                Sou um <span class="highlight">Analista de Dados</span> e Desenvolvedor de 
                <span class="highlight">BI & Automação</span> focado em transformar dados brutos em decisões inteligentes e processos eficientes.
            </p>
            
            <div class="btn-group">
                <a href="Currículo_Erik_New.pdf" download="Currículo_Erik_New.pdf" class="btn btn-purple">
                    <i class="fas fa-file-download"></i> Currículo
                </a>

                <a href="https://github.com/Erik-us22" target="_blank" class="btn btn-outline">
                    <i class="fas fa-code"></i> Projetos
                </a>

                <a href="https://wa.me/5524998124890?text=Olá%20Erik!%20Vi%20seu%20portfólio%20e%20gostaria%20de%20conversar." 
                   target="_blank" 
                   class="btn btn-cyan">
                    <i class="fab fa-whatsapp"></i> Contato
                </a>
            </div>
        </div>
    </main>

</body>
</html>
